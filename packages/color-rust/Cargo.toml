[package]
name = "color-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8.5"
serde_json = "1"
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
color-wasm = { path = "../color-wasm" }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
jxl-oxide = { version = "0.12.6", default-features = false, features = ["image"] }
zenavif = "0.1.6"
zenpixels-convert = { version = "0.2.16", features = ["rgb"] }

[profile.release]
# `strip = true` breaks wasm-bindgen Worker builds. This Worker remains well
# below the Cloudflare code-size limit, so favor runtime speed over -Oz.
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
