[package]
name = "fractal-wasm"
version = "0.1.0"
edition = "2021"

[lib]
# `cdylib` builds the browser-facing WASM module; `rlib` lets the healthz-rust
# Cloudflare Worker link the same render kernel for server-side rendering.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Must match the installed wasm-bindgen CLI version exactly.
wasm-bindgen = "=0.2.127"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
