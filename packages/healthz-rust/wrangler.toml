name = "healthz-rust"
main = "build/index.js"
compatibility_date = "2026-05-13"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1.0

[observability.logs]
enabled = true
head_sampling_rate = 1.0
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1.0
persist = true

[env.canary]
name = "healthz-rust-canary"

[env.dev]
name = "healthz-rust-dev"

[env.production]
name = "healthz-rust-production"
