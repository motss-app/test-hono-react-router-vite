[package]
name = "healthz-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "=0.8.7"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
js-sys = "=0.3.106"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
