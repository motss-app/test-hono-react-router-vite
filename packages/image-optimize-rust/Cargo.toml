[package]
name = "image-optimize-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
