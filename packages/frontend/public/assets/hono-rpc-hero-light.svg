<svg width="1600" height="1080" viewBox="0 0 1600 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="150" y1="104" x2="1420" y2="1022" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9FCFF"/>
      <stop offset="0.5" stop-color="#EEF6FF"/>
      <stop offset="1" stop-color="#DCEEFF"/>
    </linearGradient>
    <linearGradient id="beam" x1="770" y1="0" x2="1290" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="0.6" stop-color="#DBEAFE" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#BFDBFE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1172 402) rotate(90) scale(320)">
      <stop stop-color="#D8EEFF"/>
      <stop offset="1" stop-color="#D8EEFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" stroke="#BFD6F6" stroke-opacity="0.38"/>
    </pattern>
    <filter id="blurLarge" x="812" y="44" width="748" height="784" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
  </defs>

  <rect width="1600" height="1080" fill="url(#bg)"/>
  <rect width="1600" height="1080" fill="url(#grid)"/>
  <rect width="1600" height="1080" fill="url(#grid)" opacity="0.32" transform="translate(36 36)"/>
  <path d="M0 0H770V1080H0V0Z" fill="url(#bg)"/>
  <path d="M574 0H1600V1080H574C792 850 914 668 948 522C998 306 840 112 574 0Z" fill="url(#beam)"/>

  <g filter="url(#blurLarge)" opacity="0.8">
    <circle cx="1172" cy="402" r="238" fill="url(#orb)"/>
  </g>

  <text x="702" y="936" fill="#2563EB" fill-opacity="0.04" font-family="'Open Sans', sans-serif" font-size="248" font-weight="700" letter-spacing="-0.08em">CLIENT</text>
  <text x="930" y="1024" fill="#0F172A" fill-opacity="0.08" font-family="'Open Sans', sans-serif" font-size="128" font-weight="700" letter-spacing="-0.05em">request → refresh</text>

  <path d="M820 250H1288" stroke="#2563EB" stroke-opacity="0.28" stroke-width="3"/>
  <path d="M820 470H1302" stroke="#38BDF8" stroke-opacity="0.26" stroke-width="3"/>
  <path d="M820 690H1274" stroke="#0F172A" stroke-opacity="0.18" stroke-width="3"/>
  <path d="M820 910H1324" stroke="#16A34A" stroke-opacity="0.26" stroke-width="3"/>

  <circle cx="820" cy="250" r="8" fill="#2563EB" fill-opacity="0.76"/>
  <circle cx="820" cy="470" r="8" fill="#38BDF8" fill-opacity="0.72"/>
  <circle cx="820" cy="690" r="8" fill="#0F172A" fill-opacity="0.34"/>
  <circle cx="820" cy="910" r="8" fill="#16A34A" fill-opacity="0.72"/>

  <text x="904" y="206" fill="#2563EB" fill-opacity="0.14" font-family="'Open Sans', sans-serif" font-size="26" font-weight="700" letter-spacing="0.18em">RPC FLOW</text>

  <text x="904" y="258" fill="#0F172A" fill-opacity="0.44" font-family="'Open Sans', sans-serif" font-size="30" font-weight="700">CLIENT</text>
  <text x="904" y="296" fill="#334155" fill-opacity="0.52" font-family="'Open Sans', sans-serif" font-size="18">typed `hc()` call from the route</text>

  <text x="904" y="478" fill="#0F172A" fill-opacity="0.46" font-family="'Open Sans', sans-serif" font-size="30" font-weight="700">ENDPOINT</text>
  <text x="904" y="516" fill="#334155" fill-opacity="0.52" font-family="'Open Sans', sans-serif" font-size="18">GET /api/rpc/hello</text>

  <text x="904" y="698" fill="#0F172A" fill-opacity="0.42" font-family="'Open Sans', sans-serif" font-size="30" font-weight="700">RESPONSE</text>
  <text x="904" y="736" fill="#334155" fill-opacity="0.5" font-family="'Open Sans', sans-serif" font-size="18">message, server, timestamp</text>

  <text x="904" y="918" fill="#0F172A" fill-opacity="0.42" font-family="'Open Sans', sans-serif" font-size="30" font-weight="700">REVALIDATE</text>
  <text x="904" y="956" fill="#334155" fill-opacity="0.5" font-family="'Open Sans', sans-serif" font-size="18">refresh without leaving the page</text>
