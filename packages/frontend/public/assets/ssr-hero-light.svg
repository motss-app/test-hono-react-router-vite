  <path d="M0 0H768V1080H0V0Z" fill="url(#bg)"/>
  <path d="M572 0H1600V1080H572C792 852 914 668 948 522C998 306 840 112 572 0Z" fill="url(#beam)"/>

  <g filter="url(#blurLarge)" opacity="0.8">
