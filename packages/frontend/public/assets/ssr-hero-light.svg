  <text x="904" y="516" fill="#334155" fill-opacity="0.52" font-family="'Open Sans', sans-serif" font-size="18">timestamp, render time, message</text>

  <text x="904" y="698" fill="#0F172A" fill-opacity="0.42" font-family="'Open Sans', sans-serif" font-size="30" font-weight="700">HEADERS</text>
