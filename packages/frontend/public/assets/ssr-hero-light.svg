  <text x="904" y="258" fill="#0F172A" fill-opacity="0.44" font-family="'Open Sans', sans-serif" font-size="30" font-weight="700">REQUEST</text>
  <text x="904" y="296" fill="#334155" fill-opacity="0.52" font-family="'Open Sans', sans-serif" font-size="18">headers, url, user agent</text>

