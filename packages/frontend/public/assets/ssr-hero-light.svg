  </g>

  <text x="700" y="936" fill="#2563EB" fill-opacity="0.04" font-family="'Open Sans', sans-serif" font-size="248" font-weight="700" letter-spacing="-0.08em">SERVER</text>
  <text x="914" y="1024" fill="#0F172A" fill-opacity="0.08" font-family="'Open Sans', sans-serif" font-size="128" font-weight="700" letter-spacing="-0.05em">request → render</text>

