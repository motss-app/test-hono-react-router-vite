name: Deploy Frontend Canary

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Frontend Canary
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOYMENT_BUILD: 'true'
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      SENTRY_RELEASE: ${{ github.sha }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.11
          cache: true

      - name: Install Dependencies
        run: deno install

      - name: Build Frontend
        run: |
          set -euo pipefail

          echo "🚀 Building private frontend..."
          deno task --cwd=packages/frontend build

      - name: Deploy Frontend
        id: deploy-frontend
        run: |
          set -euo pipefail

          echo "🚀 Deploying private frontend worker..."

          if ! deno run -A npm:wrangler deploy --config packages/frontend/wrangler.jsonc --env canary > deploy-frontend.log 2>&1; then
            cat deploy-frontend.log
            exit 1
          fi

          cat deploy-frontend.log

      - name: Show Frontend deploy log on failure
        if: ${{ failure() && steps.deploy-frontend.outcome == 'failure' }}
        run: |
          set -euo pipefail

          WRANGLER_LOG_FILE=$(sed -n 's/.*Logs were written to "\([^"]*\)".*/\1/p' deploy-frontend.log | tail -n 1)

          if [ -n "${WRANGLER_LOG_FILE}" ] && [ -f "${WRANGLER_LOG_FILE}" ]; then
            echo "🪵 Showing Wrangler log: ${WRANGLER_LOG_FILE}"
            cat "${WRANGLER_LOG_FILE}"
          else
            echo "Wrangler log file not found, showing deploy output instead"
            cat deploy-frontend.log
          fi
