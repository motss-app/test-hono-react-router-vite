name: Deploy Gateway Canary

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Gateway Canary
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOYMENT_BUILD: 'true'
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      SENTRY_RELEASE: ${{ github.sha }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.11
          cache: true

      - name: Install Dependencies
        run: deno install

      - name: Build Gateway
        env:
          CLOUDFLARE_ENV: canary
        run: |
          set -euo pipefail

          echo "🚀 Building Gateway..."
          deno task --cwd=packages/gateway build

      - name: Wait for Canary Dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          wait_for_workflow_run() {
            local workflow="$1"
            local label="$2"

            echo "⏳ Waiting for ${label} to finish for ${GITHUB_SHA}..."

            while true; do
              local status
              local conclusion

              status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${GITHUB_SHA}&per_page=1" --jq '.workflow_runs[0].status // empty')
              conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${GITHUB_SHA}&per_page=1" --jq '.workflow_runs[0].conclusion // empty')

              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" == "success" ]]; then
                  echo "✅ ${label} completed successfully"
                  return 0
                fi

                echo "❌ ${label} completed with conclusion=${conclusion:-unknown}"
                return 1
              fi

              echo "⏳ ${label} is ${status:-queued}; checking again soon..."
              sleep 20
            done
          }

          wait_for_workflow_run "deploy-fe-canary.yml" "Frontend Canary"
          wait_for_workflow_run "deploy-bff-canary.yml" "BFF Canary"

      - name: Deploy Gateway
        id: deploy-gateway
        run: |
          set -euo pipefail

          echo "🚀 Deploying public gateway worker..."

          if ! (cd packages/gateway && deno run -A npm:wrangler deploy --env canary > deploy-gateway.log 2>&1); then
            cat packages/gateway/deploy-gateway.log
            exit 1
          fi

          cat packages/gateway/deploy-gateway.log
          echo "canary_url=https://hono-react-router-vite-canary.motss.fyi" >> $GITHUB_OUTPUT
          echo "CANARY_URL=https://hono-react-router-vite-canary.motss.fyi" >> $GITHUB_ENV

      - name: Show Gateway deploy log on failure
        if: ${{ failure() && steps.deploy-gateway.outcome == 'failure' }}
        run: |
          set -euo pipefail

          WRANGLER_LOG_FILE=$(sed -n 's/.*Logs were written to "\([^"]*\)".*/\1/p' packages/gateway/deploy-gateway.log | tail -n 1)

          if [ -n "${WRANGLER_LOG_FILE}" ] && [ -f "${WRANGLER_LOG_FILE}" ]; then
            echo "🪵 Showing Wrangler log: ${WRANGLER_LOG_FILE}"
            cat "${WRANGLER_LOG_FILE}"
          else
            echo "Wrangler log file not found, showing deploy output instead"
            cat packages/gateway/deploy-gateway.log
          fi

      - name: Purge Cloudflare Cache for Canary
        if: steps.deploy-gateway.outputs.canary_url != ''
        run: |
          curl -X DELETE "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/cache/purge" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["hono-react-router-vite-canary.motss.fyi"]}'
          echo "✅ Canary Cloudflare cache purged"

      - name: Summary
        if: steps.deploy-gateway.outputs.canary_url != ''
        run: |
          echo "### 🚀 Canary Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "🐥 **Canary**: $CANARY_URL" >> $GITHUB_STEP_SUMMARY

      - name: Warm up Cache & Verify
        if: steps.deploy-gateway.outputs.canary_url != ''
        run: |
          set -euo pipefail

          echo "Warming up Canary: $CANARY_URL..."
          all_ok=true

          ROUTES=("" "about" "ssr" "hono-rpc" "errors")
          for route in "${ROUTES[@]}"; do
            TARGET="$CANARY_URL/$route"
            TARGET=${TARGET%/}
            echo "Fetching $TARGET..."

            if curl -s -L -o /dev/null -w "%{http_code}" "$TARGET" | grep 200; then
              echo "✅ $TARGET is up!"
            else
              echo "⚠️ Failed to fetch $TARGET"
              all_ok=false
            fi
          done

          if [ "${all_ok}" != true ]; then
            exit 1
          fi
