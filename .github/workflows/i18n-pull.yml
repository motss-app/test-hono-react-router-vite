name: Sync i18n Translations

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]

# Cancel in-progress runs for the same trigger
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-translations:
    if: github.event_name == 'push' || github.event.label.name == 'i18n/pull'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Setup Deno
        uses: ./.github/actions/setup-deno

      - name: Pull translations from i18nexus
        run: deno task pull:i18n
        env:
          I18NEXUS_API_KEY: ${{ secrets.I18NEXUS_API_KEY }}

      - name: Check for changes
        id: changes
        run: |
          STATUS=$(git status --porcelain -- 'messages/')
          if [ -z "$STATUS" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No translation changes detected"
          else
            # Only proceed if non-base-language files have changed
            # (base language en-US is maintained locally, not pulled)
            NON_BASE_CHANGES=$(echo "$STATUS" | grep -v 'en-US.json' || true)
            if [ -z "$NON_BASE_CHANGES" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Only base language file changed — discarding (source strings are local)"
              git checkout -- messages/en-US.json 2>/dev/null || true
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Translation changes detected:"
              echo "$NON_BASE_CHANGES"
            fi
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add messages/*.json
          # Exclude base language file from the commit
          git reset -- messages/en-US.json 2>/dev/null || true
          git commit -m "chore(i18n): sync translations from i18nexus"
          git push origin main

      - name: Remove label
        if: github.event_name == 'pull_request'
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label "i18n/pull"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
