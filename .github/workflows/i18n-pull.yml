name: Sync i18n Translations

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]

# Cancel in-progress runs for the same trigger
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-translations:
    if: github.event_name == 'push' || github.event.label.name == 'i18n/pull'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Setup Deno
        uses: ./.github/actions/setup-deno

      - name: Pull translations from i18nexus
        run: deno task pull:i18n
        env:
          I18NEXUS_API_KEY: ${{ secrets.I18NEXUS_API_KEY }}

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- 'messages/')" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No translation changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Translation changes detected:"
            git status --short -- 'messages/'
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add messages/*.json
          git commit -m "chore(i18n): sync translations from i18nexus"
          git push origin main

      - name: Remove label
        if: github.event_name == 'pull_request'
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label "i18n/pull"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
