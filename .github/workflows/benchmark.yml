name: Benchmark

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: ./.github/actions/setup-deno

      - name: Make oha executable
        run: chmod +x bin/oha-linux-amd64

      - name: Install dependencies
        run: deno install

      - name: Run benchmark comparison
        id: bench
        run: |
          COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          deno run -A scripts/bench-compare.ts \
            --baseline=bench-baseline.md \
            --commit="$COMMIT_SHA" \
            --output-dir=.bench-results
        continue-on-error: true

      - name: Generate job summary
        if: always()
        run: |
          if [ -f .bench-results/benchmark-report.md ]; then
            cat .bench-results/benchmark-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ERROR - No benchmark results found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = '.bench-results/benchmark-summary.json';
            const reportPath = '.bench-results/benchmark-report.md';

            let body = '';

            if (fs.existsSync(summaryPath)) {
              const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
              const status = summary.status.toUpperCase();
              const emoji = status === 'REGRESSION' ? '🔴' : status === 'IMPROVEMENT' ? '🟢' : '🟡';

              body = `## ${emoji} Benchmark ${status}\n\n`;
              body += `**Commit:** \`${summary.commitSha.slice(0, 8)}\`\n\n`;

              if (summary.regressions.length > 0) {
                body += `### Regressions (${summary.regressions.length})\n\n`;
                body += `| Route | RPS Delta | p99 Delta |\n`;
                body += `|-------|-----------|-----------|\n`;
                for (const r of summary.regressions) {
                  const rpsDelta = r.rpsDelta > 0 ? `+${r.rpsDelta.toFixed(1)}%` : `${r.rpsDelta.toFixed(1)}%`;
                  const p99Delta = r.p99Delta > 0 ? `+${r.p99Delta.toFixed(1)}%` : `${r.p99Delta.toFixed(1)}%`;
                  body += `| ${r.route} | ${rpsDelta} | ${p99Delta} |\n`;
                }
                body += `\n`;
              }

              if (summary.improvements.length > 0) {
                body += `### Improvements (${summary.improvements.length})\n\n`;
                body += `| Route | RPS Delta | p99 Delta |\n`;
                body += `|-------|-----------|-----------|\n`;
                for (const r of summary.improvements) {
                  const rpsDelta = r.rpsDelta > 0 ? `+${r.rpsDelta.toFixed(1)}%` : `${r.rpsDelta.toFixed(1)}%`;
                  const p99Delta = r.p99Delta > 0 ? `+${r.p99Delta.toFixed(1)}%` : `${r.p99Delta.toFixed(1)}%`;
                  body += `| ${r.route} | ${rpsDelta} | ${p99Delta} |\n`;
                }
                body += `\n`;
              }

              body += `<details>\n<summary>Full Report</summary>\n\n`;
              if (fs.existsSync(reportPath)) {
                body += fs.readFileSync(reportPath, 'utf8');
              }
              body += `\n</details>\n`;
            } else {
              body = '## 🔴 Benchmark Error\n\nFailed to run benchmark comparison.';
            }

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## 🔴 Benchmark REGRESSION\n## 🟢 Benchmark IMPROVEMENT\n## 🟡 Benchmark TIE\n## 🔴 Benchmark ERROR';
            const existingComment = comments.find(c =>
              c.body.startsWith('## 🔴 Benchmark REGRESSION') ||
              c.body.startsWith('## 🟢 Benchmark IMPROVEMENT') ||
              c.body.startsWith('## 🟡 Benchmark TIE') ||
              c.body.startsWith('## 🔴 Benchmark ERROR')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                body,
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
            } else {
              await github.rest.issues.createComment({
                body,
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
            }

      - name: Update baseline on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.bench.outcome == 'success'
        run: |
          if [ -f .bench-results/benchmark-results.md ]; then
            cp .bench-results/benchmark-results.md bench-baseline.md
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add bench-baseline.md
            git diff --cached --quiet || git commit -m "chore: update benchmark baseline"
            git push
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: .bench-results/
          retention-days: 30

      - name: Fail on regression
        if: steps.bench.outcome == 'failure'
        run: |
          echo "Benchmark regression detected!"
          exit 1
