name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install Dependencies
        run: deno install

      - name: Build
        run: deno task build:worker

      - name: Deploy to Cloudflare Workers
        id: deploy
        run: |
          deno run -A npm:wrangler deploy > deploy.log 2>&1 || { cat deploy.log; exit 1; }

          cat deploy.log

          URL=$(grep -o 'https://[^ ]*' deploy.log | grep -v 'github.com' | head -n 1)

          echo "DEPLOY_URL=$URL" >> $GITHUB_ENV

          echo "### 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "Your worker is live at: **$URL**" >> $GITHUB_STEP_SUMMARY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Warm up Cache & Verify
        run: |
          echo "Warming up $DEPLOY_URL..."
          
          # List of routes to warm up
          ROUTES=("" "about" "ssr" "hono-rpc" "errors")
          
          for route in "${ROUTES[@]}"; do
            TARGET="$DEPLOY_URL/$route"
            # Remove trailing slash if route is empty
            TARGET=${TARGET%/}
            
            echo "Fetching $TARGET..."
            # Use -L to follow redirects (if any) and check for 200 OK
            curl -s -L -o /dev/null -w "%{http_code}" "$TARGET" | grep 200 && echo "✅ $TARGET is up!" || echo "⚠️ Failed to fetch $TARGET"
          done
