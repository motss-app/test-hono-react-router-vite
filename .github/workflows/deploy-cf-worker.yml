name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'canary'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      SENTRY_RELEASE: ${{ github.sha }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install Dependencies
        run: deno install

      - name: Build & Deploy Canary
        id: deploy-canary
        run: |
          echo "🚀 Building Canary..."
          deno task build:worker:canary
          
          echo "🚀 Deploying Canary..."
          # Deploy with a suffix to separate it from production
          deno run -A npm:wrangler deploy --env canary > deploy-canary.log 2>&1 || { cat deploy-canary.log; exit 1; }
          
          cat deploy-canary.log
          URL=$(grep -oE 'https://[^ ]*workers\.dev' deploy-canary.log | head -n 1)
          echo "CANARY_URL=$URL" >> $GITHUB_ENV
      - name: Build & Deploy Production
        if: github.ref == 'refs/heads/main'
        id: deploy-production
        run: |
          echo "🚀 Building Production..."
          deno task build:worker
          
          echo "🚀 Deploying Production..."
          deno run -A npm:wrangler deploy --env production > deploy-prod.log 2>&1 || { cat deploy-prod.log; exit 1; }
          
          cat deploy-prod.log
          URL=$(grep -oE 'https://[^ ]*workers\.dev' deploy-prod.log | head -n 1)
          echo "PROD_URL=$URL" >> $GITHUB_ENV

      - name: Purge Cloudflare Cache
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X DELETE "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/cache/purge" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything": true}'
          echo "✅ Cloudflare cache purged"

      - name: Summary
        run: |
          echo "### 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "$CANARY_URL" ]; then
            echo "🐥 **Canary**: $CANARY_URL" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -n "$PROD_URL" ]; then
            echo "✅ **Production**: $PROD_URL" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Warm up Cache & Verify
        run: |
          # Warm up Canary
          if [ -n "$CANARY_URL" ]; then
            echo "Warming up Canary: $CANARY_URL..."
            ROUTES=("" "about" "ssr" "hono-rpc" "errors")
            for route in "${ROUTES[@]}"; do
              TARGET="$CANARY_URL/$route"
              TARGET=${TARGET%/}
              echo "Fetching $TARGET..."
              curl -s -L -o /dev/null -w "%{http_code}" "$TARGET" | grep 200 && echo "✅ $TARGET is up!" || echo "⚠️ Failed to fetch $TARGET"
            done
          fi

          # Warm up Production
          if [ -n "$PROD_URL" ]; then
            echo "Warming up Production: $PROD_URL..."
            ROUTES=("" "about" "ssr" "hono-rpc" "errors")
            for route in "${ROUTES[@]}"; do
              TARGET="$PROD_URL/$route"
              TARGET=${TARGET%/}
              echo "Fetching $TARGET..."
              curl -s -L -o /dev/null -w "%{http_code}" "$TARGET" | grep 200 && echo "✅ $TARGET is up!" || echo "⚠️ Failed to fetch $TARGET"
            done
          fi
