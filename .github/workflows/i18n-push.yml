name: Push i18n Source Strings

on:
  push:
    branches: [main]
    paths:
      - 'messages/en-US.json'

# Cancel in-progress runs for the same trigger
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-strings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Setup Deno
        uses: ./.github/actions/setup-deno

      - name: Push new/updated strings to i18nexus
        run: deno task push:i18n
        env:
          I18NEXUS_API_KEY: ${{ secrets.I18NEXUS_API_KEY }}
          I18NEXUS_PERSONAL_ACCESS_TOKEN: ${{ secrets.I18NEXUS_PAT }}
