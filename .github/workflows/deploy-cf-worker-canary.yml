name: Deploy to Cloudflare Workers Canary

on:
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'canary'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Canary
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOYMENT_BUILD: 'true'
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      SENTRY_RELEASE: ${{ github.sha }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install Dependencies
        run: deno install

      - name: Build Canary
        run: |
          echo "🚀 Building Canary..."
          deno task build:worker:canary

      - name: Deploy Canary
        id: deploy-canary
        run: |
          set -euo pipefail

          max_attempts=5
          attempt=1

          while true; do
            echo "🚀 Deploying Canary (attempt ${attempt}/${max_attempts})..."

            if deno run -A npm:wrangler deploy --env canary --log-level debug > deploy-canary.log 2>&1; then
              break
            fi

            cat deploy-canary.log

            if [ "${attempt}" -ge "${max_attempts}" ]; then
              exit 1
            fi

            sleep_seconds=$((attempt * 5))
            echo "⚠️ Deploy failed. Retrying in ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
            attempt=$((attempt + 1))
          done

          cat deploy-canary.log
          URL=$(grep -oE 'https://[^ ]*workers\.dev' deploy-canary.log | head -n 1)
          echo "canary_url=$URL" >> $GITHUB_OUTPUT
          echo "CANARY_URL=$URL" >> $GITHUB_ENV

      - name: Purge Cloudflare Cache for Canary
        if: steps.deploy-canary.outputs.canary_url != ''
        run: |
          curl -X DELETE "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/cache/purge" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["hono-react-router-vite-canary.motss.fyi"]}'
          echo "✅ Canary Cloudflare cache purged"

      - name: Summary
        if: steps.deploy-canary.outputs.canary_url != ''
        run: |
          echo "### 🚀 Canary Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "🐥 **Canary**: $CANARY_URL" >> $GITHUB_STEP_SUMMARY

      - name: Warm up Cache & Verify
        if: steps.deploy-canary.outputs.canary_url != ''
        run: |
          echo "Warming up Canary: $CANARY_URL..."
          ROUTES=("" "about" "ssr" "hono-rpc" "errors")
          for route in "${ROUTES[@]}"; do
            TARGET="$CANARY_URL/$route"
            TARGET=${TARGET%/}
            echo "Fetching $TARGET..."
            curl -s -L -o /dev/null -w "%{http_code}" "$TARGET" | grep 200 && echo "✅ $TARGET is up!" || echo "⚠️ Failed to fetch $TARGET"
          done
