name: Saturation Test

on:
  workflow_dispatch:
  pull_request:

jobs:
  saturation:
    name: Find max CCU
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-deno

      # actions/cache v6.1.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: k6-cache
        with:
          path: /usr/local/bin/k6
          key: k6-2.0.0-${{ runner.os }}

      - name: Install k6
        if: steps.k6-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/grafana/k6/releases/download/v2.0.0/k6-v2.0.0-linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "k6-v2.0.0-linux-amd64/k6"

      - name: Start server
        run: |
          deno run -A scripts/saturation-test-server.ts &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 10); do
            if curl -sf http://127.0.0.1:9999/ > /dev/null 2>&1; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - name: Run saturation test
        run: |
          K6_BINARY=/usr/local/bin/k6 \
          BASE_URL=http://127.0.0.1:9999 \
          deno run -A scripts/saturation-test.ts 10,50,150,300,500,1000,3000,5000 2>&1 | tee /tmp/saturation-output.txt

      - name: Kill server
        if: always()
        run: kill ${{ env.SERVER_PID }} 2>/dev/null || true

      - name: Write step summary
        if: always()
        run: |
          {
            echo '```'
            cat /tmp/saturation-output.txt
            echo '```'
            echo ''
            echo '### System'
            echo ''
            echo "- **OS**: $(uname -srm)"
            echo "- **CPUs**: $(nproc) logical cores"
            echo "- **Memory**: $(free -h | awk '/^Mem:/ {print $2}') total"
            echo "- **Deno**: $(deno --version | head -1)"
            echo "- **Runner**: ${{ runner.name }} (${{ runner.os }})"
          } >> "$GITHUB_STEP_SUMMARY"

          # Build comment body
          {
            echo '<!-- saturation-comment -->'
            echo '## Saturation Test Results'
            echo ''
            echo '```'
            cat /tmp/saturation-output.txt
            echo '```'
            echo ''
            echo '### System'
            echo ''
            echo "- **OS**: $(uname -srm)"
            echo "- **CPUs**: $(nproc) logical cores"
            echo "- **Memory**: $(free -h | awk '/^Mem:/ {print $2}') total"
            echo "- **Deno**: $(deno --version | head -1)"
            echo "- **Runner**: ${{ runner.name }} (${{ runner.os }})"
          } > /tmp/saturation-comment.md

      - name: Upsert PR comment
        uses: ./.github/actions/upsert-pr-comment
        if: always() && github.event_name == 'pull_request'
        with:
          marker: '<!-- saturation-comment -->'
          body-file: /tmp/saturation-comment.md
