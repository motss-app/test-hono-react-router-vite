name: Route Bundle Size

on:
  pull_request:
  push:
    branches:
      - main

env:
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SENTRY_RELEASE: local

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route-bundle-size:
    name: Check Route Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-deno

      - name: Build
        run: deno task build

      - name: Measure and summarize bundle sizes
        run: |
          deno task route-bundle-size --json > /tmp/current-bundle-size.json
          echo '## Route Bundle Size' >> "$GITHUB_STEP_SUMMARY"
          deno task route-bundle-size >> "$GITHUB_STEP_SUMMARY"

      - name: Use PR baseline (PR only)
        if: github.event_name == 'pull_request'
        run: |
          if [ -f route-bundle-size-baseline.json ]; then
            cp route-bundle-size-baseline.json /tmp/baseline-bundle-size.json
            echo "Using baseline from PR branch"
          else
            echo '{"entry":{"gzipBytes":0,"rawBytes":0},"rootLayout":{"gzipBytes":0,"rawBytes":0},"routes":[]}' > /tmp/baseline-bundle-size.json
            echo "No baseline found, using empty baseline"
          fi

      - name: Use current as baseline (main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp /tmp/current-bundle-size.json /tmp/baseline-bundle-size.json

      - name: Compare and generate comment (PR only)
        id: compare
        if: github.event_name == 'pull_request'
        run: |
          set +e
          deno run -A scripts/check-route-bundle-size.ts /tmp/current-bundle-size.json --baseline /tmp/baseline-bundle-size.json --budget 50 --output /tmp/bundle-size-comment.md
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          # Set the step outcome based on exit code
          if [ -f /tmp/bundle-size-comment.md ] && grep -q "❌" /tmp/bundle-size-comment.md; then
            echo "regression=true" >> "$GITHUB_OUTPUT"
            cat /tmp/bundle-size-comment.md
            exit 1
          else
            echo "regression=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upsert comparison comment (PR only)
        uses: ./.github/actions/upsert-pr-comment
        if: github.event_name == 'pull_request' && always()
        with:
          marker: '<!-- route-bundle-size-comment -->'
          body-file: /tmp/bundle-size-comment.md

      - name: Fail on budget exceeded (PR only)
        if: github.event_name == 'pull_request' && steps.compare.outputs.regression == 'true'
        run: |
          echo "❌ Route bundle size budget exceeded (>50% gzip increase)."
          echo "Check the PR comment for details."
          exit 1

      - name: Commit baseline via GitHub API (auto-signed by GitHub)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          BASELINE_FILE: route-bundle-size-baseline.json
        run: |
          set -euo pipefail
          CURRENT=''
          [ -f "$BASELINE_FILE" ] && CURRENT=$(cat "$BASELINE_FILE")
          NEXT=$(cat /tmp/current-bundle-size.json)
          if [ "$CURRENT" = "$NEXT" ]; then
            echo 'No baseline change; skipping commit.'
            exit 0
          fi
          CONTENT_B64=$(printf '%s' "$NEXT" | base64 | tr -d '\n')
          HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')
          BLOB_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" \
            -f content="$CONTENT_B64" -f encoding=base64 --jq '.sha')
          TREE_PAYLOAD=$(jq -nc --arg path "$BASELINE_FILE" --arg sha "$BLOB_SHA" \
            '{base_tree:$ENV.HEAD_SHA, tree:[{path:$path, mode:"100644", type:"blob", sha:$sha}]}')
          TREE_SHA=$(echo "$TREE_PAYLOAD" | gh api "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq '.sha')
          COMMIT_PAYLOAD=$(jq -nc --arg msg 'chore: update route bundle size baseline' \
            --arg tree "$TREE_SHA" --arg parent "$HEAD_SHA" \
            '{message:$msg, tree:$tree, parents:[$parent]}')
          COMMIT_SHA=$(echo "$COMMIT_PAYLOAD" | gh api "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq '.sha')
          gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" \
            -X PATCH -f sha="$COMMIT_SHA" >/dev/null
          echo "Committed $COMMIT_SHA on $BRANCH"
