name: Load Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  K6_VERSION: 2.0.0
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SENTRY_RELEASE: local

jobs:
  load-test:
    name: Load Test (${{ matrix.ccu }} CCU)
    strategy:
      fail-fast: false
      matrix:
        ccu: [10, 50, 150, 300, 500]
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-deno

      # actions/cache v6.1.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: k6-cache
        with:
          path: /usr/local/bin/k6
          key: k6-${{ env.K6_VERSION }}-${{ runner.os }}

      - name: Install k6
        if: steps.k6-cache.outputs.cache-hit != 'true'
        run: |
          K6_VER=${K6_VERSION#v}
          curl -fsSL "https://github.com/grafana/k6/releases/download/v${K6_VER}/k6-v${K6_VER}-linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "k6-v${K6_VER}-linux-amd64/k6"

      - name: Build
        run: deno task build

      - name: Start standalone SSR
        run: |
          deno run -A scripts/standalone-ssr.ts &
          echo "ssr_pid=$!" >> "$GITHUB_ENV"

      - name: Start standalone BFF
        run: |
          deno run -A scripts/standalone-bff.ts &
          echo "bff_pid=$!" >> "$GITHUB_ENV"

      - name: Wait for servers
        run: |
          for i in $(seq 1 30); do
            ssr_ok=false
            bff_ok=false
            if curl -sf http://localhost:5175/healthz > /dev/null 2>&1; then
              ssr_ok=true
            fi
            if curl -sf http://localhost:3001/api/healthz > /dev/null 2>&1; then
              bff_ok=true
            fi
            if [ "$ssr_ok" = true ] && [ "$bff_ok" = true ]; then
              echo "All servers ready"
              exit 0
            fi
            sleep 2
          done
          echo "Servers not ready after 60s"
          exit 1

      - name: Run k6
        run: |
          k6 run -e BASE_URL=http://localhost:5175 -e CCU=${{ matrix.ccu }} k6-load-test.mjs
          mv k6-results.json k6-results-${{ matrix.ccu }}.json

      - name: Kill servers
        if: always()
        run: |
          kill ${{ env.ssr_pid }} 2>/dev/null || true
          kill ${{ env.bff_pid }} 2>/dev/null || true

      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: k6-results-${{ matrix.ccu }}
          path: k6-results-${{ matrix.ccu }}.json

  report:
    name: Compare & Report
    needs: load-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: download
        with:
          pattern: k6-results-*
          merge-multiple: true

      - name: List results
        run: ls -la k6-results-*.json

      - name: Compare against baselines
        id: results
        run: |
          REGRESSED=0
          REGRESSION_MSGS=""
          VIOLATIONS=""

          for CCU in 10 50 150 300 500; do
            NEW="k6-results-${CCU}.json"
            if [ ! -f "$NEW" ]; then
              REGRESSION_MSGS="${REGRESSION_MSGS}- ⚠️ ${CCU} CCU: no result, skipping\n"
              continue
            fi

            BASELINE="k6-baseline/${CCU}.json"
            if [ ! -f "$BASELINE" ]; then
              REGRESSION_MSGS="${REGRESSION_MSGS}- ${CCU} CCU: no baseline, skipping\n"
              continue
            fi

            for TYPE in ssg ssr; do
              BASE=$(jq -r ".${TYPE}.ttfb.p95" "$BASELINE")
              NEW_VAL=$(jq -r ".${TYPE}.ttfb.p95" "$NEW")

              if [ "$BASE" = "null" ] || [ "$BASE" = "0" ]; then
                continue
              fi

              # ── Absolute latency rating ──
              if [ "$(echo "$NEW_VAL >= 500" | bc -l)" = "1" ]; then
                ABSRating="🔴"
              elif [ "$(echo "$NEW_VAL >= 100" | bc -l)" = "1" ]; then
                ABSRating="🟡"
              else
                ABSRating="🟢"
              fi

              # ── Regression rating ──
              REGRating="🟢"
              DELTA=$(echo "scale=2; (${NEW_VAL} - ${BASE}) / ${BASE} * 100" | bc)
              ABS_DELTA=$(echo "scale=2; ${NEW_VAL} - ${BASE}" | bc)
              IS_POOR=$(echo "$DELTA > 25 && $ABS_DELTA > 10" | bc -l)
              IS_WARN=$(echo "$DELTA > 10 && $ABS_DELTA > 5" | bc -l)
              if [ "$IS_POOR" = "1" ]; then
                REGRating="🔴"
              elif [ "$IS_WARN" = "1" ]; then
                REGRating="🟡"
              fi

              # ── Build message ──
              if [ "$REGRating" = "🔴" ]; then
                REGRESSED=1
                MSG="- ${REGRating}${ABSRating} **${CCU} CCU ${TYPE^^} p95**: ${BASE}ms → ${NEW_VAL}ms (**+${DELTA}%**)\n"
                REGRESSION_MSGS="${REGRESSION_MSGS}${MSG}"
                VIOLATIONS="${VIOLATIONS}${MSG}"
              elif [ "$REGRating" = "🟡" ] || [ "$ABSRating" = "🟡" ] || [ "$ABSRating" = "🔴" ]; then
                MSG="- ${REGRating}${ABSRating} ${CCU} CCU ${TYPE^^} p95: ${BASE}ms → ${NEW_VAL}ms (+${DELTA}%)\n"
                REGRESSION_MSGS="${REGRESSION_MSGS}${MSG}"
              fi
            done
          done

          if [ "$REGRESSED" = "1" ]; then
            echo "regression_detected=true" >> "$GITHUB_OUTPUT"
            printf '%b' "$VIOLATIONS" > /tmp/regression-msgs.txt
          fi

          # ── Build markdown ──
          {
            echo '## Load Test Results'
            echo ''
            echo '<!-- load-test-comment -->'
            echo ''

            print_type_table() {
              local TYPE=$1 LABEL=$2
              echo "### ${LABEL}"
              echo ''
              echo '| CCU | RPS | p75 | p90 | p95 | success |'
               echo '|-----|-----|-----|-----|-----|---------|'
              for CCU in 10 50 150 300 500; do
                N="k6-results-${CCU}.json"
                B="k6-baseline/${CCU}.json"
                if [ ! -f "$N" ]; then
                  echo "| ${CCU} | N/A | N/A | N/A | N/A | N/A |"
                  continue
                fi

                # Current values
                RPS=$(jq -r "(.${TYPE}.rps | floor)" "$N")
                P75=$(jq -r ".${TYPE}.ttfb.p75" "$N")
                P90=$(jq -r ".${TYPE}.ttfb.p90" "$N")
                P95=$(jq -r ".${TYPE}.ttfb.p95" "$N")
                OK=$(jq -r "(.${TYPE}.success_rate * 100 | floor)" "$N")

                # Baseline values
                BRPS=$(jq -r "(.${TYPE}.rps // 0 | floor)" "$B" 2>/dev/null || echo "N/A")
                BP75=$(jq -r "try (.${TYPE}.ttfb.p75 // \"N/A\") catch \"N/A\"" "$B" 2>/dev/null || echo "N/A")
                BP90=$(jq -r "try (.${TYPE}.ttfb.p90 // \"N/A\") catch \"N/A\"" "$B" 2>/dev/null || echo "N/A")
                BP95=$(jq -r "try (.${TYPE}.ttfb.p95 // \"N/A\") catch \"N/A\"" "$B" 2>/dev/null || echo "N/A")
                BOK=$(jq -r "try ((.${TYPE}.success_rate // 0) * 100 | floor // \"N/A\") catch \"N/A\"" "$B" 2>/dev/null || echo "N/A")

                # Build cells with before→after (delta) inline
                cell() {
                  local CUR=$1 BASE=$2 SUFFIX=$3
                  if [ "$BASE" = "N/A" ] || [ "$BASE" = "null" ] || [ "$BASE" = "0" ]; then
                    echo "${CUR}${SUFFIX}"
                  else
                    D=$(echo "scale=1; (${CUR} - ${BASE}) / ${BASE} * 100" | bc 2>/dev/null || echo "?")
                    echo "${BASE}${SUFFIX}→${CUR}${SUFFIX} (${D}%)"
                  fi
                }

                RPS_C=$(cell "$RPS" "$BRPS" "")
                P75_C=$(cell "$P75" "$BP75" "ms")
                P90_C=$(cell "$P90" "$BP90" "ms")
                P95_C=$(cell "$P95" "$BP95" "ms")
                OK_C=$(cell "$OK" "$BOK" "%")

                echo "| ${CCU} | ${RPS_C} | ${P75_C} | ${P90_C} | ${P95_C} | ${OK_C} |"
              done
            }

            print_type_table ssg SSG
            echo ''
            print_type_table ssr SSR
          } >> "$GITHUB_STEP_SUMMARY"

          # Copy to a persistent file for the comment step below
          # GITHUB_STEP_SUMMARY is reset per-step and would be empty in the next step
          cp "$GITHUB_STEP_SUMMARY" /tmp/load-test-comment.md

      - name: Upsert PR comment
        uses: ./.github/actions/upsert-pr-comment
        if: github.event_name == 'pull_request'
        with:
          marker: '<!-- load-test-comment -->'
          body-file: /tmp/load-test-comment.md

      - name: Fail on regression
        if: steps.results.outputs.regression_detected == 'true'
        run: |
          echo "🔴 Load test regression detected (>25% p95 increase AND >10ms absolute)"
          echo ""
          echo "Violations:"
          cat /tmp/regression-msgs.txt 2>/dev/null || echo "  (details not available)"
          echo ""
          echo "Thresholds: 🟢 Good (<10% or <5ms) | 🟡 Warning (10-25% and >5ms) | 🔴 Poor (>25% and >10ms)"
          exit 1

      - name: Update baselines
        if: steps.download.outcome == 'success' && steps.results.outputs.regression_detected != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p k6-baseline
          for CCU in 10 50 150 300 500; do
            cp "k6-results-${CCU}.json" "k6-baseline/${CCU}.json"
          done

          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k6-baseline/
          if ! git diff --cached --quiet; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              git commit -m "chore: update k6 baseline"
            else
              git commit -m "chore: update k6 baseline [skip ci]"
            fi
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}"
            git push origin "HEAD:${BRANCH}"
          else
            echo "No baseline changes"
          fi
