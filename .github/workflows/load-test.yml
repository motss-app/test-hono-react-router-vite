name: Load Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: https://hono-react-router-vite.motss.fyi
  K6_VERSION: 2.0.0
  REGRESSION_THRESHOLD: 10 # TTFB p95 % increase allowed before failing

jobs:
  load-test:
    name: Load Test ${{ matrix.ccu }} CCU
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ccu: [10, 50, 150, 300]
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # actions/cache v6.1.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: k6-cache
        with:
          path: /usr/local/bin/k6
          key: k6-${{ env.K6_VERSION }}-${{ runner.os }}

      - name: Install k6
        if: steps.k6-cache.outputs.cache-hit != 'true'
        run: |
          K6_VER=${K6_VERSION#v}
          curl -fsSL "https://github.com/grafana/k6/releases/download/v${K6_VER}/k6-v${K6_VER}-linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "k6-v${K6_VER}-linux-amd64/k6"

      - name: Run k6 at ${{ matrix.ccu }} CCU
        run: |
          k6 run \
            -e BASE_URL="$BASE_URL" \
            -e CCU="${{ matrix.ccu }}" \
            k6-load-test.mjs
          mv k6-results.json "k6-results-${{ matrix.ccu }}.json"

      # actions/upload-artifact v4
      - uses: actions/upload-artifact@92b8a0a8dfaf4b0c3f6817ab0ab3db1654bc1e4f # v4
        with:
          name: k6-results-${{ matrix.ccu }}
          path: k6-results-${{ matrix.ccu }}.json

  report:
    name: Compare & Report
    needs: load-test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # actions/download-artifact v4
      - uses: actions/download-artifact@c1d98187d50c6f1adcdf5b126201662eac4890ac # v4
        with:
          pattern: k6-results-*
          merge-multiple: true

      - name: List results
        run: ls -la k6-results-*.json

      - name: Compare against baselines
        id: results
        run: |
          REGRESSED=0
          REGRESSION_MSGS=""

          for CCU in 10 50 150 300; do
            NEW="k6-results-${CCU}.json"
            if [ ! -f "$NEW" ]; then
              REGRESSION_MSGS="${REGRESSION_MSGS}- ⚠️ ${CCU} CCU: no result, skipping\n"
              continue
            fi

            BASELINE="k6-baseline/${CCU}.json"
            if [ ! -f "$BASELINE" ]; then
              REGRESSION_MSGS="${REGRESSION_MSGS}- ${CCU} CCU: no baseline, skipping\n"
              continue
            fi

            for TYPE in ssg ssr; do
              BASE=$(jq -r ".${TYPE}.ttfb.p95" "$BASELINE")
              NEW_VAL=$(jq -r ".${TYPE}.ttfb.p95" "$NEW")

              if [ "$BASE" = "null" ] || [ "$BASE" = "0" ]; then
                continue
              fi

              DELTA=$(echo "scale=2; (${NEW_VAL} - ${BASE}) / ${BASE} * 100" | bc)
              FLAG=$(echo "$DELTA > ${{ env.REGRESSION_THRESHOLD }}" | bc -l)

              if [ "$FLAG" = "1" ]; then
                REGRESSED=1
                REGRESSION_MSGS="${REGRESSION_MSGS}- ❌ **${CCU} CCU ${TYPE^^} p95**: ${BASE}ms → ${NEW_VAL}ms (**+${DELTA}%**)\n"
              elif [ "$(echo "$DELTA > 5" | bc -l)" = "1" ]; then
                REGRESSION_MSGS="${REGRESSION_MSGS}- ⚠️ ${CCU} CCU ${TYPE^^} p95: ${BASE}ms → ${NEW_VAL}ms (+${DELTA}%)\n"
              fi
            done
          done

          echo "regression_detected=${REGRESSED}" >> "$GITHUB_OUTPUT"

          # ── Build markdown ──
          {
            echo '## Load Test Results'
            echo ''
            echo '<!-- load-test-comment -->'
            echo ''

            print_type_table() {
              local TYPE=$1 LABEL=$2
              echo "### ${LABEL}"
              echo ''
              echo '| CCU | RPS | p75 | p90 | p95 | success |'
              echo '|-----|-----|-----|-----|-----|---------|'
              for CCU in 10 50 150 300; do
                N="k6-results-${CCU}.json"
                B="k6-baseline/${CCU}.json"
                if [ ! -f "$N" ]; then
                  echo "| ${CCU} | N/A | N/A | N/A | N/A | N/A |"
                  continue
                fi

                # Current values
                RPS=$(jq -r "(.${TYPE}.rps | floor)" "$N")
                P75=$(jq -r ".${TYPE}.ttfb.p75" "$N")
                P90=$(jq -r ".${TYPE}.ttfb.p90" "$N")
                P95=$(jq -r ".${TYPE}.ttfb.p95" "$N")
                OK=$(jq -r "(.${TYPE}.success_rate * 100 | floor)" "$N")

                # Baseline values
                BRPS=$(jq -r "(.${TYPE}.rps // 0 | floor)" "$B" 2>/dev/null || echo "N/A")
                BP75=$(jq -r "try (.${TYPE}.ttfb.p75 // \"N/A\") catch \"N/A\"" "$B" 2>/dev/null || echo "N/A")
                BP90=$(jq -r "try (.${TYPE}.ttfb.p90 // \"N/A\") catch \"N/A\"" "$B" 2>/dev/null || echo "N/A")
                BP95=$(jq -r "try (.${TYPE}.ttfb.p95 // \"N/A\") catch \"N/A\"" "$B" 2>/dev/null || echo "N/A")
                BOK=$(jq -r "try ((.${TYPE}.success_rate // 0) * 100 | floor // \"N/A\") catch \"N/A\"" "$B" 2>/dev/null || echo "N/A")

                # Build cells with before→after (delta) inline
                cell() {
                  local CUR=$1 BASE=$2 SUFFIX=$3
                  if [ "$BASE" = "N/A" ] || [ "$BASE" = "null" ] || [ "$BASE" = "0" ]; then
                    echo "${CUR}${SUFFIX}"
                  else
                    D=$(echo "scale=1; (${CUR} - ${BASE}) / ${BASE} * 100" | bc 2>/dev/null || echo "?")
                    echo "${BASE}${SUFFIX}→${CUR}${SUFFIX} (${D}%)"
                  fi
                }

                RPS_C=$(cell "$RPS" "$BRPS" "")
                P75_C=$(cell "$P75" "$BP75" "ms")
                P90_C=$(cell "$P90" "$BP90" "ms")
                P95_C=$(cell "$P95" "$BP95" "ms")
                OK_C=$(cell "$OK" "$BOK" "%")

                echo "| ${CCU} | ${RPS_C} | ${P75_C} | ${P90_C} | ${P95_C} | ${OK_C} |"
              done
            }

            print_type_table ssg SSG
            echo ''
            print_type_table ssr SSR
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}

          COMMENT_ID=$(gh api "/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- load-test-comment -->"))) | .id')

          if [ -n "$COMMENT_ID" ]; then
            echo "Updating comment #${COMMENT_ID}"
            gh api "/repos/${REPO}/issues/comments/${COMMENT_ID}" \
              -F "body=@$GITHUB_STEP_SUMMARY" -X PATCH
          else
            echo "Creating new comment"
            gh pr comment "${PR_NUMBER}" --body-file "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail on regression
        if: steps.results.outputs.regression_detected == 'true'
        run: |
          echo "❌ Performance regression detected"
          exit 1

      - name: Update baselines
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p k6-baseline
          for CCU in 10 50 150 300; do
            cp "k6-results-${CCU}.json" "k6-baseline/${CCU}.json"
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k6-baseline/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update k6 baseline [skip ci]"
            git push
          else
            echo "No baseline changes"
          fi
