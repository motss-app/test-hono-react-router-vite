name: Deploy Canary

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  DEPLOYMENT_BUILD: 'true'
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SENTRY_RELEASE: ${{ github.sha }}
  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}

jobs:
  frontend_canary:
    name: Frontend Canary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Deno environment
        uses: ./.github/actions/setup-deno
      - name: Deploy Frontend Canary
        uses: ./.github/actions/deploy-frontend-canary

  bff_canary:
    name: BFF Canary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Deno environment
        uses: ./.github/actions/setup-deno
      - name: Deploy BFF Canary
        uses: ./.github/actions/deploy-bff-canary

  gateway_canary:
    name: Gateway Canary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Deno environment
        uses: ./.github/actions/setup-deno
      - name: Deploy Gateway Canary
        uses: ./.github/actions/deploy-gateway-canary
