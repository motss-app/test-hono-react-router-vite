name: Deploy Canary

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  DEPLOYMENT_BUILD: 'true'
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SENTRY_RELEASE: ${{ github.sha }}
  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
  VITE_POSTHOG_TOKEN: ${{ secrets.VITE_POSTHOG_TOKEN_CANARY }}
  VITE_POSTHOG_API_HOST: ${{ vars.VITE_POSTHOG_API_HOST }}

jobs:
  frontend_canary:
    name: Frontend Canary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Deno environment
        uses: ./.github/actions/setup-deno
      # The frontend build imports the generated glue (gitignored), so the
      # wasm must be built first, right here.
      - name: Build client WASM
        uses: ./.github/actions/build-fractal-wasm
      - name: Deploy Frontend Canary
        uses: ./.github/actions/deploy-frontend-canary

  bff_canary:
    name: BFF Canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Deno environment
        uses: ./.github/actions/setup-deno
      - name: Deploy BFF Canary
        uses: ./.github/actions/deploy-bff-canary

  gateway_canary:
    name: Gateway Canary
    # Waits for the worker deploys so the service bindings resolve.
    needs: rust_workers_canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Deno environment
        uses: ./.github/actions/setup-deno
      - name: Deploy Gateway Canary
        uses: ./.github/actions/deploy-gateway-canary

  # Deploys every Rust worker in parallel — one runner per matrix leg.
  # To add a new Rust worker: add its package name to the matrix below.
  # Note: `uses` cannot interpolate expressions, so the shared steps live
  # inline here instead of in a per-package composite action.
  rust_workers_canary:
    name: Rust Worker Canary (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - healthz-rust
          - fractal-rust
          - color-rust
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Deno environment
        uses: ./.github/actions/setup-deno
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/${{ matrix.package }} -> target
      - name: Install worker-build
        run: cargo install worker-build --version 0.8.5 --locked
      - name: Build ${{ matrix.package }} worker
        working-directory: packages/${{ matrix.package }}
        run: |
          cargo build --target wasm32-unknown-unknown --release
          worker-build --release
      - name: Deploy ${{ matrix.package }} (canary)
        working-directory: packages/${{ matrix.package }}
        run: deno x wrangler deploy --config wrangler.toml --env canary
