name: Install Binaryen
description: Install a pinned native Binaryen release for wasm-opt

inputs:
  version:
    description: Binaryen release tag
    required: false
    default: version_132
  sha256:
    description: SHA-256 for the Linux x86_64 Binaryen archive
    required: false
    default: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572

runs:
  using: composite
  steps:
    - name: Cache Binaryen archive
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/binaryen
        key: binaryen-${{ runner.os }}-x86_64-${{ inputs.version }}-${{ inputs.sha256 }}

    - name: Download and install Binaryen
      shell: bash
      env:
        BINARYEN_VERSION: ${{ inputs.version }}
        BINARYEN_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        archive="binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
        cache_dir="$HOME/.cache/binaryen/$BINARYEN_VERSION"
        archive_path="$cache_dir/$archive"
        install_dir="$RUNNER_TEMP/binaryen-$BINARYEN_VERSION"
        mkdir -p "$cache_dir"
        if [ ! -f "$archive_path" ]; then
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/${archive}" \
            -o "$archive_path"
        fi
        printf '%s  %s\n' "$BINARYEN_SHA256" "$archive_path" | sha256sum --check
        mkdir -p "$install_dir"
        tar -xzf "$archive_path" --strip-components=1 -C "$install_dir"
        echo "$install_dir/bin" >> "$GITHUB_PATH"
        "$install_dir/bin/wasm-opt" --version
