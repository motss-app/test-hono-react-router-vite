name: Deploy Healthz Rust Canary
description: Build and deploy the Rust healthz worker to Cloudflare Workers (canary).

runs:
  using: composite
  steps:
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: Run Healthz Rust Canary deployment
      shell: bash
      run: deno run -A "${GITHUB_ACTION_PATH}/run.ts"
