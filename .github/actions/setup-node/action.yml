name: Setup Node
description: Install the pinned Node.js toolchain, pnpm, and repo dependencies for CI jobs.

runs:
  using: composite
  steps:
    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json

    # Omitting `version` makes the action read the `packageManager` field from
    # package.json, so the pnpm pin lives in exactly one place.
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install repository dependencies
      shell: bash
      run: pnpm install
