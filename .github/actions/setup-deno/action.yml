name: Setup Deno
description: Install the pinned Deno toolchain and repo dependencies for canary deploy jobs.

runs:
  using: composite
  steps:
    - name: Install Deno v2.9.6
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: 2.9.6
        cache: true

    - name: Install repository dependencies
      shell: bash
      run: deno install
