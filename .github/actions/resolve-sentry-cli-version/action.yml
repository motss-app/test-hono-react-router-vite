name: Resolve Sentry CLI version
description: Resolve the latest Sentry CLI release from the npm registry

outputs:
  version:
    description: The resolved Sentry CLI version
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - name: Read latest Sentry CLI release from npm
      id: resolve
      shell: bash
      run: |
        SENTRY_CLI_VERSION=$(npm view @sentry/cli version)
        test -n "$SENTRY_CLI_VERSION"
        printf 'version=%s\n' "$SENTRY_CLI_VERSION" >> "$GITHUB_OUTPUT"
