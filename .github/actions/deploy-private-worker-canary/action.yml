name: Deploy Private Worker Canary
description: Build, validate, and deploy a private canary worker service.

inputs:
  display-name:
    description: Human-readable job label, such as Frontend Canary or BFF Canary.
    required: true
  service:
    description: Service name to deploy, such as frontend or bff.
    required: true

runs:
  using: composite
  steps:
    - name: Run ${{ inputs.display-name }} deployment
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SERVICE: ${{ inputs.service }}
      run: |
        set -euo pipefail
        deno run -A "${ACTION_PATH}/run.ts"
