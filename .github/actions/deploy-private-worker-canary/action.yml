name: Deploy Private Worker Canary
description: Build, validate, and deploy a private canary worker service.

inputs:
  service:
    description: Service name to deploy, such as frontend or bff.
    required: true

runs:
  using: composite
  steps:
    - name: Deploy ${{ inputs.service }} canary
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SERVICE: ${{ inputs.service }}
      run: |
        set -euo pipefail
        deno run -A "${ACTION_PATH}/run.ts"
