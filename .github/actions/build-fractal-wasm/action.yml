name: Build Fractal WASM
description: Build the Rust WASM module for the WASM Labs pages. Required before any frontend build — the generated glue in packages/frontend/app/labs-wasm is gitignored.

runs:
  using: composite
  steps:
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: packages/fractal-wasm -> target

    - name: Install wasm-bindgen CLI
      shell: bash
      run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

    - name: Build WASM module
      shell: bash
      run: deno task build:fractal-wasm
