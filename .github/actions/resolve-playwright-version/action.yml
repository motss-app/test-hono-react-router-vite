name: Resolve Playwright version
description: Resolve locked Playwright version

outputs:
  version:
    description: The resolved Playwright version
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - name: Read resolved Playwright version from Deno
      id: resolve
      shell: bash
      run: |
        PLAYWRIGHT_VERSION=$(deno info --frozen-lockfile --json playwright | jq -er '[.npmPackages[] | select(.name == "playwright") | .version] | unique | if length == 1 then .[0] else error("expected one resolved Playwright version") end')
        printf 'version=%s\n' "$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"
