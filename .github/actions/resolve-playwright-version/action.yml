name: Resolve Playwright version
description: Resolve locked Playwright version

outputs:
  version:
    description: The resolved Playwright version
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - name: Read resolved Playwright version from pnpm
      id: resolve
      shell: bash
      run: |
        PLAYWRIGHT_VERSION=$(node -p "require('playwright/package.json').version")
        test -n "$PLAYWRIGHT_VERSION"
        printf 'version=%s\n' "$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"
